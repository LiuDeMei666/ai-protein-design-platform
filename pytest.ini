[pytest]
testpaths = tests
# 让 backend.* 可直接导入（pytest 7+ 的 pythonpath 配置）
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q --tb=short --strict-markers
markers =
    slow: 需要 GPU / ESM-2 权重 / 耗时较长的用例
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
